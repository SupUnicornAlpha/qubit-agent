[workspace]
resolver = "2"
members = [
  "crates/qubit-protocol",
  "crates/qubit-runtime",
  "crates/qubit-app-server",
  "crates/qubit-tool-host",
  "crates/qubit-policy",
]
# Tauri 桌面壳独立工程，勿并入 Prime crates workspace（依赖树/profile 不同）。
exclude = ["src-tauri"]
default-members = [
  "crates/qubit-protocol",
  "crates/qubit-runtime",
  "crates/qubit-app-server",
  "crates/qubit-tool-host",
  "crates/qubit-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["QUBIT Contributors"]
repository = ""

[workspace.dependencies]
qubit-protocol = { path = "crates/qubit-protocol" }
qubit-runtime = { path = "crates/qubit-runtime" }
qubit-tool-host = { path = "crates/qubit-tool-host" }
qubit-policy = { path = "crates/qubit-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["json"] }
